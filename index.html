<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Madan & Aishwarya — Wedding</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Sacramento&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a0a0e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    overflow: hidden;
  }

  /* ── POSTCARD ── */
  .postcard-wrap {
    perspective: 1200px;
    width: min(520px, 92vw);
  }

  .postcard {
    width: 100%;
    aspect-ratio: 3/2;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.4,0,.2,1), box-shadow .6s;
    cursor: pointer;
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(201,168,76,.2);
  }
  .postcard:hover {
    box-shadow: 0 40px 100px rgba(0,0,0,.7), 0 0 40px rgba(201,168,76,.15);
    transform: rotateY(5deg) rotateX(-2deg) scale(1.02);
  }
  .postcard.open {
    transform: rotateY(180deg) scale(0) !important;
    opacity: 0;
    transition: transform .8s cubic-bezier(.4,0,.2,1), opacity .4s .4s, box-shadow .4s;
  }

  /* Front face */
  .postcard-front {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 12px;
    overflow: hidden;
    background: #fdf3d7;
  }
  .postcard-front img {
    width: 90%;
    height: 95%;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    mask-image: radial-gradient(ellipse at 50% 45%, black 50%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 50%, transparent 78%);
  }
  /* Overlay hint */
  .postcard-hint {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 1.2rem;
    background: linear-gradient(transparent, rgba(0,0,0,.55));
    text-align: center;
    color: #f0d080;
    font-family: 'Cinzel', serif;
    font-size: .65rem;
    letter-spacing: .3em;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity .3s;
  }
  .postcard:hover .postcard-hint { opacity: 1; }

  /* Gold border */
  .postcard-front::after {
    content: '';
    position: absolute; inset: 8px;
    border: 1px solid rgba(201,168,76,.4);
    border-radius: 8px;
    pointer-events: none;
  }

  /* Name overlay on card */
  .postcard-names {
    position: absolute;
    bottom: 1.2rem; left: 0; right: 0;
    text-align: center;
    font-family: 'Sacramento', cursive;
    font-size: clamp(1.8rem, 6vw, 2.8rem);
    color: #4a3a9a;
    text-shadow: 0 2px 12px rgba(0,0,0,.4), 0 0 30px rgba(100,80,200,.5);
    pointer-events: none;
  }

  /* ── INVITE OVERLAY ── */
  .invite-overlay {
    position: fixed; inset: 0;
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .6s .5s;
  }
  .invite-overlay.visible {
    opacity: 1;
    pointer-events: all;
  }
  .invite-overlay iframe {
    width: min(480px, 96vw);
    height: 92vh;
    border: none;
    border-radius: 12px;
    box-shadow: 0 40px 120px rgba(0,0,0,.8);
    transform: scale(.9) translateY(30px);
    transition: transform .6s .5s cubic-bezier(.2,1,.3,1);
  }
  .invite-overlay.visible iframe {
    transform: scale(1) translateY(0);
  }
  .close-btn {
    position: fixed;
    top: 1.2rem; right: 1.2rem;
    background: rgba(201,168,76,.2);
    border: 1px solid rgba(201,168,76,.4);
    color: #f0d080;
    font-family: 'Cinzel', serif;
    font-size: .7rem; letter-spacing: .2em;
    padding: .5rem 1rem;
    border-radius: 4px;
    cursor: pointer;
    z-index: 101;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s .8s, background .2s;
  }
  .close-btn:hover { background: rgba(201,168,76,.35); }
  .invite-overlay.visible ~ .close-btn {
    opacity: 1;
    pointer-events: all;
  }

  /* Falling petals */
  .petal {
    position: fixed; top: -40px;
    font-size: 1.2rem;
    animation: fall linear infinite;
    pointer-events: none;
    z-index: 1; opacity: 0;
  }
  @keyframes fall {
    0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
  }

  /* Hint text below card */
  .tap-hint {
    text-align: center;
    margin-top: 1.5rem;
    font-family: 'Cinzel', serif;
    font-size: .65rem;
    letter-spacing: .25em;
    color: rgba(201,168,76,.5);
    text-transform: uppercase;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: .5; }
    50%      { opacity: 1; }
  }
</style>
</head>
<body>

<div class="postcard-wrap">
  <div class="postcard" id="postcard" onclick="openInvite()">
    <div class="postcard-front">
      <!-- Replace src with your image path once saved -->
      <img src="krishna-radha.jpg" alt="Krishna & Radha"
           onerror="this.style.display='none'; this.parentNode.style.background='linear-gradient(135deg,#fdf3d7,#e8d090)'"/>
      <div class="postcard-names">Madan & Aishwarya</div>
      <div class="postcard-hint">✦ Tap to open your invitation ✦</div>
    </div>
  </div>
  <p class="tap-hint">✦ Tap the card to open ✦</p>
</div>

<!-- Invite overlay -->
<div class="invite-overlay" id="overlay">
  <iframe src="wedding-invite.html" id="inviteFrame"></iframe>
</div>
<button class="close-btn" id="closeBtn" onclick="closeInvite()">✕ &nbsp; Close</button>

<script>
  function openInvite() {
    const card = document.getElementById('postcard');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    card.classList.add('open');
    setTimeout(() => {
      overlay.classList.add('visible');
      closeBtn.style.opacity = '1';
      closeBtn.style.pointerEvents = 'all';
    }, 500);
  }

  function closeInvite() {
    const card = document.getElementById('postcard');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    overlay.classList.remove('visible');
    closeBtn.style.opacity = '0';
    closeBtn.style.pointerEvents = 'none';
    setTimeout(() => {
      card.classList.remove('open');
    }, 400);
  }

  // Falling petals
  const petals = ['🌸','🌺','🌷'];
  function spawnPetal() {
    const el = document.createElement('div');
    el.className = 'petal';
    el.textContent = petals[Math.floor(Math.random() * petals.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (.7 + Math.random()) + 'rem';
    const dur = 5 + Math.random() * 7;
    el.style.animationDuration = dur + 's';
    el.style.animationDelay = Math.random() * 2 + 's';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), (dur + 2) * 1000);
  }
  setInterval(spawnPetal, 1000);
  for (let i = 0; i < 5; i++) spawnPetal();
</script>
</body>
</html>
